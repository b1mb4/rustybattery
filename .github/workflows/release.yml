name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-x86_64:
    name: Build & Test Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball (x86_64)
        run: |
          cp target/release/rustybattery .
          tar -czf rustybattery-linux-x86_64.tar.gz rustybattery README.md install.sh man/

      - name: Package Debian/Ubuntu .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          PKG_DIR="rustybattery_${VERSION}_amd64"
          mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/bin" "${PKG_DIR}/usr/share/man/man1"
          cp target/release/rustybattery "${PKG_DIR}/usr/bin/rustybattery"
          ln -s /usr/bin/rustybattery "${PKG_DIR}/usr/bin/battery"
          cp man/rustybattery.1 "${PKG_DIR}/usr/share/man/man1/rustybattery.1"
          cp man/battery.1 "${PKG_DIR}/usr/share/man/man1/battery.1"
          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: rustybattery
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libc6
          Homepage: https://github.com/b1mb4/rustybattery
          Maintainer: b1mb4 <artemkluenkov41@gmail.com>
          Description: RustyBattery — Per-App Power Tracker & Battery Optimizer for Linux
          EOF
          dpkg-deb --build "${PKG_DIR}"
          mv "${PKG_DIR}.deb" rustybattery_amd64.deb

      - name: Upload x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-x86_64
          path: |
            rustybattery-linux-x86_64.tar.gz
            rustybattery_amd64.deb

  build-aarch64:
    name: Build & Test Linux (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests (aarch64)
        run: cargo test --locked

      - name: Build release binary (aarch64)
        run: cargo build --release --locked

      - name: Package tarball (aarch64)
        run: |
          cp target/release/rustybattery .
          tar -czf rustybattery-linux-aarch64.tar.gz rustybattery README.md install.sh man/

      - name: Upload aarch64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-aarch64
          path: |
            rustybattery-linux-aarch64.tar.gz

  publish:
    name: Merge Checksums, Attest & Publish Release
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate merged SHA256SUMS
        run: |
          (cd dist && sha256sum rustybattery-linux-x86_64.tar.gz rustybattery-linux-aarch64.tar.gz rustybattery_amd64.deb > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/rustybattery-linux-x86_64.tar.gz
            dist/rustybattery-linux-aarch64.tar.gz
            dist/rustybattery_amd64.deb
            dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/rustybattery-linux-x86_64.tar.gz
            dist/rustybattery-linux-aarch64.tar.gz
            dist/rustybattery_amd64.deb
            dist/SHA256SUMS
