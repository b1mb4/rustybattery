[package]
name = "rustybattery"
version = "0.3.0"
edition = "2021"
default-run = "rustybattery"
description = "RustyBattery — Per-App Power Tracker & Battery Optimizer for Linux"
authors = ["b1mb4 <artemkluenkov41@gmail.com>"]
repository = "https://github.com/b1mb4/rustybattery"
homepage = "https://github.com/b1mb4/rustybattery"
readme = "README.md"
license = "MIT"
keywords = ["battery", "linux", "power", "tui", "monitoring"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
anyhow = "1.0.97"
chrono = { version = "0.4.40", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.35", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0.0"
libc = "0.2.171"
ratatui = "0.29"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
