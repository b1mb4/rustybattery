name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Linux Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball (x86_64)
        run: |
          cp target/release/rustybattery .
          tar -czf rustybattery-linux-x86_64.tar.gz rustybattery README.md install.sh

      - name: Package Debian/Ubuntu .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="0.3.0"; fi
          PKG_DIR="rustybattery_${VERSION}_amd64"
          mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/bin"
          cp target/release/rustybattery "${PKG_DIR}/usr/bin/rustybattery"
          ln -s /usr/bin/rustybattery "${PKG_DIR}/usr/bin/battery"
          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: rustybattery
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libc6, libsqlite3-0
          Maintainer: b1mb4 <artemkluenkov41@gmail.com>
          Description: RustyBattery — Per-App Power Tracker & Battery Optimizer for Linux
          EOF
          dpkg-deb --build "${PKG_DIR}"
          mv "${PKG_DIR}.deb" rustybattery_amd64.deb

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            rustybattery-linux-x86_64.tar.gz
            rustybattery_amd64.deb

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v') && env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty
